name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 테스트가 import하는 DB·TTS·음악 모듈의 가벼운 의존성만 설치한다.
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Syntax check (whole project)
        run: python -m compileall -q bot.py core cogs utils GameSystem

      - name: Run tests
        run: pytest tests -q
